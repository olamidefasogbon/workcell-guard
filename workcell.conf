# QNX Virtual Light Curtain - Workcell Configuration
#
# Strict format: unknown keys, malformed numbers and out-of-range values are
# FATAL at start-up (a safety config is either correct or the process refuses to run).

device_path=/dev/safety_gate
shm_name=/workcell_cam

# --- Safety timing ---------------------------------------------------------
watchdog_tick_ms=5
# No valid vision report for this long -> OSSD 0 V.
heartbeat_timeout_ms=150
# A frame older than this (capture -> gate) is stale -> OSSD 0 V.
max_frame_age_ms=100
# A reset is only accepted after this many consecutive clear frames.
reset_clear_frames=15
# vision_worker exits (and is respawned, re-mapping shm) if the camera stalls this long.
frame_stall_exit_ms=500
# supervisor kills a vision_worker whose heartbeat is older than this.
hang_kill_ms=400

# ISO 13849-1 restart interlock. Must be 1 in production builds
# (0 is only accepted by a WORKCELL_TEST_HOOKS build).
latch_faults=1

# --- Camera & vision -------------------------------------------------------
target_fps=30
sim_width=320
sim_height=240
# Rectangular zone x1,y1,x2,y2 (normalised 0..1). For a polygon use
# zone_pts=x,y;x,y;x,y;...  (3..8 points) instead.
zone_norm=0.50,0.20,0.92,0.85
diff_threshold=38
# Blob closer than this to the polygon counts as an intrusion (px).
cutoff_margin_px=15
# Background is never updated within this distance of the polygon while anything is visible (px).
freeze_margin_px=30
cell_hit_min=34
min_blob_cells=4
bg_warmup_frames=20

# --- Process priorities (SCHED_FIFO) & recovery ----------------------------
# Must satisfy gate > supervisor > camera > vision > telemetry.
prio_gate=25
prio_supervisor=20
prio_camera=15
prio_vision=10
prio_telemetry=5
respawn_delay_ms=250
respawn_backoff_max_ms=5000

# --- Network ----------------------------------------------------------------
telemetry_port=9876
cam_ingest_port=9877
frame_stream_port=9878
# Only this host may send control commands (RESET/ZONE/video ingest).
# Set it to the dashboard host's address before deployment, e.g.:
# control_allow_ip=192.168.184.1
