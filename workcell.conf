# QNX Virtual Light Curtain - Workcell Configuration
device_path=/dev/safety_gate
shm_name=/workcell_cam
watchdog_tick_ms=5
heartbeat_timeout_ms=150
latch_faults=0

# Camera & Vision Parameters
target_fps=30
sim_width=320
sim_height=240
zone_norm=0.50,0.20,0.92,0.85
diff_threshold=28
min_blob_ratio=0.005
bg_warmup_frames=20
bg_alpha=0.02

# Process Priorities (SCHED_FIFO) & Recovery
prio_gate=25
prio_supervisor=20
prio_camera=15
prio_vision=10
respawn_delay_ms=250
prio_telemetry=5
telemetry_port=9876
cam_ingest_port=9877
